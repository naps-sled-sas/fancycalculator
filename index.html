<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    (function () {
      var fallback = "https://script.google.com/macros/s/DEPLOYMENT_ID/exec";
      function go(url) { location.replace(url + location.search + location.hash); }
      fetch("target.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (data) { go(data.url || fallback); })
        .catch(function () { go(fallback); });
    })();
  </script>
</head>
<body>
  <p>Redirecting…
     <a href="https://script.google.com/macros/s/DEPLOYMENT_ID/exec">Continue</a></p>
</body>
</html>
